spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true

logging:
  level:
    root: INFO
    br.com.vitrine7: INFO

app:
  security:
    jwt-issuer: vitrine7-backend
    jwt-secret: ${JWT_SECRET}
    jwt-expiration: PT8H
    inactivity-expiration: PT5H
    activity-touch-interval: PT5M
    auth-cookie-name: VITRINE7_AUTH
    cookie-secure: true
    cookie-same-site: Lax
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

    initial-admin:
      name: ${INITIAL_ADMIN_NAME}
      username: ${INITIAL_ADMIN_USERNAME}
      password: ${INITIAL_ADMIN_PASSWORD}

    super-admin:
      username: ${VITRINE7_SUPERADMIN_USERNAME:}
      password: ${VITRINE7_SUPERADMIN_PASSWORD:}

  payment:
    manual-fallback-enabled: ${MANUAL_PAYMENT_FALLBACK_ENABLED:false}
