spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/vitrine7_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true

logging:
  level:
    root: INFO
    br.com.vitrine7: DEBUG
    org.hibernate.SQL: DEBUG
    org.springframework.web: INFO
    org.springframework.security: INFO
    org.springframework.jdbc.core: INFO

app:
  security:
    jwt-issuer: vitrine7-backend
    jwt-secret: ${JWT_SECRET:c7FFVrUzu8TbZKpBFUojLuqLtxsCR23TKKHZ6Hr2ZKo=}
    jwt-expiration: PT8H
    inactivity-expiration: PT5H
    activity-touch-interval: PT5M
    auth-cookie-name: VITRINE7_AUTH
    cookie-secure: false
    cookie-same-site: Lax
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

    initial-admin:
      name: ${INITIAL_ADMIN_NAME:Administrador}
      username: ${INITIAL_ADMIN_USERNAME:admin}
      password: ${INITIAL_ADMIN_PASSWORD:Vitrine7@123}

    super-admin:
      username: ${VITRINE7_SUPERADMIN_USERNAME:superadmin}
      password: ${VITRINE7_SUPERADMIN_PASSWORD:}

  payment:
    manual-fallback-enabled: true
