spring:
  application:
    name: vitrine7-backend

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

app:
  name: Vitrine 7
  api-prefix: /api/v1
  business-time-zone: ${APP_BUSINESS_TIME_ZONE:America/Bahia}
  establishment:
    name: ${APP_ESTABLISHMENT_NAME:Vitrine 7}
    document: ${APP_ESTABLISHMENT_DOCUMENT:}
    phone: ${APP_ESTABLISHMENT_PHONE:}
    address: ${APP_ESTABLISHMENT_ADDRESS:Rua Senhor do Bonfim, Monte Gordo, Camaçari/BA}
  backup:
    pg-dump-path: ${APP_BACKUP_PG_DUMP_PATH:pg_dump}
    timeout: ${APP_BACKUP_TIMEOUT:5m}
  printer-agent:
    token: ${APP_PRINTER_AGENT_TOKEN:}
    long-poll-max: ${APP_PRINTER_AGENT_LONG_POLL_MAX:25s}
    offline-after: ${APP_PRINTER_AGENT_OFFLINE_AFTER:90s}
  payment-terminal:
    bridge:
      command-timeout: ${APP_PAYMENT_TERMINAL_BRIDGE_COMMAND_TIMEOUT:120s}
      long-poll-max: ${APP_PAYMENT_TERMINAL_BRIDGE_LONG_POLL_MAX:25s}
      offline-after: ${APP_PAYMENT_TERMINAL_BRIDGE_OFFLINE_AFTER:90s}
      pairing-code-ttl: ${APP_PAYMENT_TERMINAL_BRIDGE_PAIRING_CODE_TTL:10m}
      expiration-interval: ${APP_PAYMENT_TERMINAL_BRIDGE_EXPIRATION_INTERVAL:5s}
